name: Build and Push Docker Image

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: restaurent-app       # Change to your image name
  DOCKER_USERNAME: sanchaljustgrow # Your Docker Hub username

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: dckr_pat_T4IK4aMULkMBrfv2h1GYaZv2sAI # Add this secret in GitHub

      - name: Determine next numeric tag
        id: version
        run: |
          echo "Fetching latest tag from Docker Hub..."
          VERSION=$(curl -s https://hub.docker.com/v2/repositories/${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}/tags/?page_size=100 \
            | jq -r '.results[].name' \
            | grep -E '^[0-9]+$' \
            | sort -nr \
            | head -n1)
          if [ -z "$VERSION" ]; then VERSION=0; fi
          NEXT_VERSION=$((VERSION + 1))
          echo "next_tag=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "Next tag: $NEXT_VERSION"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.next_tag }}

      - name: Print pushed tags
        run: |
          echo "✅ Pushed Docker tags:"
          echo " - latest"
          echo " - ${{ steps.version.outputs.next_tag }}"
